name: SmartGym CI/CD Pipeline

on:
  push:
    branches: [main, develop, IT24103194]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI (.NET 8)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: smartgym
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore SmartGym.sln

      - name: Build Solution
        run: dotnet build SmartGym.sln --no-restore --configuration Release

      - name: Run Backend Tests
        run: dotnet test SmartGym.sln --no-build --configuration Release --verbosity normal

  ai-service-ci:
    name: AI Microservice CI (Python & LangGraph)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ai-service/requirements.txt ]; then pip install -r ai-service/requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Run AI Microservice & Multi-Agent Tests
        run: |
          pytest tests/ai -v

  frontend-ci:
    name: Frontend Web CI (React & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-web/smartgym-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run React Component & Integration Tests
        run: npm test

      - name: Build React Production Bundle
        run: npm run build

  flutter-ci:
    name: Flutter Mobile CI (Analyze & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile/smartgym_mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

  docker-build-ci:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/SmartGym.Api/Dockerfile
          push: false
          tags: smartgym-api:latest

      - name: Build AI Microservice Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: smartgym-ai:latest

      - name: Build Frontend Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web/smartgym-web
          file: ./frontend-web/smartgym-web/Dockerfile
          push: false
          tags: smartgym-web:latest
