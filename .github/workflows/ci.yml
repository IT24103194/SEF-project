name: SmartGym CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    name: Backend CI (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore SmartGym.sln

      - name: Build Solution
        run: dotnet build SmartGym.sln --no-restore --configuration Release

      - name: Run Backend Tests
        run: dotnet test SmartGym.sln --no-build --configuration Release --verbosity normal

  ai-service-ci:
    name: AI Microservice CI (Python 3.12/3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run AI Unit Tests
        run: |
          if [ -d tests ]; then pytest tests; else echo "No AI tests directory yet"; fi

  frontend-ci:
    name: Frontend Web CI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-web/smartgym-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then npm ci || npm install; fi

      - name: Build React Web App
        run: |
          if [ -f package.json ]; then npm run build; fi
