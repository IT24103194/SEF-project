services:
  postgres:
    image: postgres:16-alpine
    container_name: smartgym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smartgym}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartgym}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/SmartGym.Api/Dockerfile
    container_name: smartgym-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-smartgym};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      JwtSettings__Key: ${JWT_SECRET:-ReplaceWithAStrongSecureSecretKeyAtLeast32BytesLongForProduction!}
      JwtSettings__Issuer: ${JWT_ISSUER:-SmartGymApi}
      JwtSettings__Audience: ${JWT_AUDIENCE:-SmartGymClients}
      AiService__BaseUrl: http://ai-service:8000
      AiService__ApiKey: ${AI_SERVICE_API_KEY:-local-dev-internal-secret-token}
      AiService__ApprovalCostThreshold: ${AI_APPROVAL_COST_THRESHOLD:-25000.0}
    ports:
      - "5000:5000"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartgym-ai-service
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-local-dev-internal-secret-token}
      AI_APPROVAL_COST_THRESHOLD: ${AI_APPROVAL_COST_THRESHOLD:-25000.0}
    ports:
      - "8000:8000"

  web-admin:
    build:
      context: ./frontend-web/smartgym-web
      dockerfile: Dockerfile
    container_name: smartgym-web-admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:80"

volumes:
  postgres-data:
